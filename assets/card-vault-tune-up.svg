<svg xmlns="http://www.w3.org/2000/svg" width="380" height="200" viewBox="0 0 380 200" role="img" aria-label="Obsidian Vault Tune-up">
  <defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b0f1e"/><stop offset="1" stop-color="#1c1236"/></linearGradient>
  <style>.title{font:700 20px Georgia,'Times New Roman',serif;fill:#f8fafc}.body{font:400 14px 'Segoe UI',Helvetica,Arial,sans-serif;fill:#c7d2fe}.tag{font:400 12px Consolas,'Courier New',monospace;fill:#e0e7ff}.state{font:400 11px Consolas,'Courier New',monospace;fill:#a78bfa}.edge{animation:p 3s ease-in-out infinite}@keyframes p{0%,100%{stroke-opacity:.35}50%{stroke-opacity:.9}}</style></defs>
  <rect x="1" y="1" width="378" height="198" rx="14" fill="url(#g)"/>
  <rect class="edge" x="1" y="1" width="378" height="198" rx="14" fill="none" stroke="#a78bfa" stroke-width="1.5"/>
  <rect x="24" y="24" width="6" height="22" rx="3" fill="#a78bfa"/>
  <text x="40" y="42" class="title">Obsidian Vault Tune-up</text>
  <text x="40" y="64" class="state">Kit público</text>
  <text x="24" y="96" class="body">Ordená una bóveda de Obsidian que ya</text>
  <text x="24" y="118" class="body">existe, con ayuda de una IA y sin</text>
  <text x="24" y="140" class="body">perder nada: índices y registro de cambios.</text>
  <rect x="24" y="150" width="80" height="24" rx="12" fill="#a78bfa" fill-opacity=".14" stroke="#a78bfa" stroke-opacity=".5"/><text x="64.0" y="166" text-anchor="middle" class="tag">Obsidian</text>
  <rect x="112" y="150" width="80" height="24" rx="12" fill="#a78bfa" fill-opacity=".14" stroke="#a78bfa" stroke-opacity=".5"/><text x="152.0" y="166" text-anchor="middle" class="tag">Markdown</text>
  <rect x="200" y="150" width="36" height="24" rx="12" fill="#a78bfa" fill-opacity=".14" stroke="#a78bfa" stroke-opacity=".5"/><text x="218.0" y="166" text-anchor="middle" class="tag">IA</text>
</svg>
